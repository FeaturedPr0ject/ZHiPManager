[package]
name = "zhiprar"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
flate2 = "1"
zstd = "0.13"
p256 = { version = "0.13", features = ["ecdsa"] }

[lib]
name = "zhipx"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ZHiPRaR"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
